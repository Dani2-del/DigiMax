spring.application.name=transcaribe_db

# Base de datos local
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/Digitrans_Max}

# Servidor y plantillas
spring.thymeleaf.cache=false
server.port=8081
app.acceso.base-url=${ACCESO_BASE_URL:http://localhost:8080}
app.mail.base-url=${MAIL_SERVICE_URL:http://localhost:8084}
app.mail.api-key=${MAIL_SERVICE_API_KEY}
spring.mvc.async.request-timeout=10m
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
server.servlet.session.timeout=30m

