spring.application.name=Orquestador
server.port=8087
server.address=127.0.0.1
orquestador.api-token=${ORQUESTADOR_API_TOKEN:}

# Carpeta raíz de DigiMax (relativa a Orquestador/)
orquestador.raiz=..

# Segundos de arranque antes de empezar a vigilar un módulo
orquestador.gracia-segundos=120
# Chequeos fallidos seguidos antes de reiniciar
orquestador.max-fallos=3
# Intervalo entre chequeos y espera inicial antes del primero
orquestador.intervalo-ms=10000
orquestador.espera-inicial-ms=30000
orquestador.arranque-timeout-segundos=120
