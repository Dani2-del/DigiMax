<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101f35">
  <title>Modelo predictivo — Digitrans</title>
  <link rel="stylesheet" th:href="@{/css/admin-global.css(v=20261025-4)}">
</head>
<body class="global-admin-page">
<div class="global-admin-shell">
  <aside class="global-sidebar">
    <a class="global-brand" th:href="@{/admin/global}">
      <img th:src="@{/images/digitrans-mark.svg}" width="40" height="40" alt="">
      <span><strong>Digitrans</strong><small>Administración global</small></span>
    </a>
    <p class="sidebar-caption">PLATAFORMA</p>
    <nav class="global-nav" aria-label="Navegación administrativa">
      <a th:href="@{/admin/global}"><span>▦</span> Resumen</a>
      <a th:href="@{/admin/global/usuarios}"><span>♙</span> Usuarios</a>
      <a th:href="@{/admin/global/transacciones}"><span>⇄</span> Transacciones</a>
      <a th:href="@{/admin/global/analitica}"><span>◷</span> Analítica global</a>
      <a th:href="@{/admin/global/chats}"><span>⌁</span> Chats operativos</a>
      <a th:href="@{/admin/global/reportes}"><span>▤</span> Reportes Excel</a>
      <a class="active" th:href="@{/admin/global/modelo-predictivo}"><span>⌁</span> Modelo predictivo</a>
    </nav>
    <div class="sidebar-bottom">
      <a th:href="@{/servicios}" class="sidebar-back">← Volver a servicios</a>
      <form th:action="@{/logout}" method="post">
        <input type="hidden" th:if="${_csrf}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <button type="submit" class="sidebar-logout">Cerrar sesión</button>
      </form>
    </div>
  </aside>
  <main class="global-main">
    <header class="global-topbar">
      <div><p class="global-eyebrow">CENTRO DE CONTROL · DIGITRANS</p><h1>Modelo predictivo</h1></div>
      <a class="back-dashboard" th:href="@{/admin/global}">← Resumen global</a>
    </header>
    <section class="global-section">
      <div class="audit-panel">
        <h2>Proximamente</h2>
      </div>
    </section>
  </main>
</div>
</body>
</html>
