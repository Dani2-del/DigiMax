<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verificar cambio de contraseña — Digitrans</title>
  <link rel="stylesheet" th:href="@{/css/usuario.css(v=20261025-2)}">
  <th:block th:replace="~{fragments/loading-indicator :: styles}"></th:block>
</head>
<body class="login-page identity-page">
  <div class="page">
    <main class="center-card">
      <section class="card">
        <h1 class="title">Confirma el cambio</h1>
        <p class="info-text">Ingresa el código enviado a <strong th:text="${correo}"></strong>.</p>
        <form th:action="@{/cuenta/seguridad/verificar}" method="post" class="form">
          <label for="codigo">Código de 6 dígitos</label>
          <input type="text" id="codigo" name="codigo" maxlength="6" pattern="\d{6}" required autocomplete="one-time-code">
          <button class="primary" type="submit">Actualizar contraseña</button>
        </form>
        <p class="error" th:if="${error}" th:text="${error}"></p>
        <a th:href="@{/cuenta/seguridad}" class="back-to-login">Cancelar</a>
      </section>
    </main>
    <div th:replace="~{fragments/footer :: footer}"></div>
  </div>
  <th:block th:replace="~{fragments/loading-indicator :: overlay}"></th:block>
</body>
</html>
