<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi cuenta — Digitrans</title>
  <link rel="stylesheet" th:href="@{/css/usuario.css}">
  <th:block th:replace="~{fragments/loading-indicator :: styles}"></th:block>
</head>
<body class="login-page">
  <div class="page">
    <main class="center-card">
      <section class="card">
        <h1 class="title">Datos de mi cuenta</h1>
        <p class="info-text">Para confirmar cambios, enviaremos un código a tu correo actual.</p>
        <form th:action="@{/cuenta/perfil}" method="post" class="form">
          <label for="nombre">Nombre</label>
          <input type="text" id="nombre" name="nombre" th:value="${nombre}" required autocomplete="name">
          <label for="correo">Correo</label>
          <input type="email" id="correo" name="correo" th:value="${correo}" required autocomplete="email">
          <button class="primary" type="submit">Guardar cambios</button>
        </form>
        <p class="error" th:if="${error}" th:text="${error}"></p>
        <p class="success" th:if="${mensaje}" th:text="${mensaje}"></p>
        <a th:href="@{/cuenta/seguridad}" class="back-to-login">Cambiar contraseña</a>
        <a th:href="@{/servicios}" class="back-to-login">Volver a servicios</a>
      </section>
    </main>
    <div th:replace="~{fragments/footer :: footer}"></div>
  </div>
  <th:block th:replace="~{fragments/loading-indicator :: overlay}"></th:block>
</body>
</html>
