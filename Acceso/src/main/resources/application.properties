spring.application.name=Acceso
server.port=${SERVER_PORT:8080}

spring.mongodb.uri=${ACCESO_MONGODB_URI:mongodb://localhost:27017/digitrans_acceso}
spring.data.mongodb.auto-index-creation=true

spring.thymeleaf.cache=false
server.servlet.session.timeout=30m

app.mail.base-url=${MAIL_SERVICE_URL:http://localhost:8084}
app.mail.api-key=${MAIL_SERVICE_API_KEY}
app.jwt.secret=${APP_JWT_SECRET}
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:86400000}
app.cookie.secure=${APP_COOKIE_SECURE:false}

app.oauth.google.enabled=true
GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:}
GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:}
app.services.transporte-url=${TRANSPORTE_URL:http://localhost:8081}
app.services.recargas-url=${RECARGAS_URL:http://localhost:8083}
app.services.billetera-url=${BILLETERA_URL:http://localhost:8082}
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.security.oauth2=DEBUG