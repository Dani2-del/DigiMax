name: digimax

services:
  mongo:
    image: mongo:7.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MONGO_PORT:-27018}:27017"
    volumes:
      - mongodb-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "mongodb://127.0.0.1:27017/admin", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 3s
      retries: 20

  pagos:
    build:
      context: .
      dockerfile: Pagos/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:8085:8085"
    environment:
      SERVER_PORT: 8085

  correo:
    build:
      context: .
      dockerfile: Correo/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:8084:8084"
    environment:
      SERVER_PORT: 8084
      MAIL_SERVICE_API_KEY: ${MAIL_SERVICE_API_KEY:?Define MAIL_SERVICE_API_KEY in .env}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}

  acceso:
    build:
      context: .
      dockerfile: Acceso/Dockerfile
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      SERVER_PORT: 8080
      ACCESO_MONGODB_URI: ${DOCKER_ACCESO_MONGODB_URI:-mongodb://mongo:27017/digitrans_acceso}
      TRANSPORTE_MONGODB_URI: ${DOCKER_TRANSPORTE_MONGODB_URI:-mongodb://mongo:27017/digitrans_transporte}
      BILLETERA_MONGODB_URI: ${DOCKER_BILLETERA_MONGODB_URI:-mongodb://mongo:27017/digitrans_billetera}
      RECARGAS_MONGODB_URI: ${DOCKER_RECARGAS_MONGODB_URI:-mongodb://mongo:27017/digitrans_recargas}
      APP_JWT_SECRET: ${APP_JWT_SECRET:?Define APP_JWT_SECRET in .env}
      APP_COOKIE_SECURE: ${APP_COOKIE_SECURE:-false}
      MAIL_SERVICE_API_KEY: ${MAIL_SERVICE_API_KEY:?Define MAIL_SERVICE_API_KEY in .env}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      APP_OAUTH_GOOGLE_ENABLED: ${APP_OAUTH_GOOGLE_ENABLED:-false}
      MAIL_SERVICE_URL: http://correo:8084
      TRANSPORTE_URL: http://localhost:8081
      RECARGAS_URL: http://localhost:8083
      BILLETERA_URL: http://localhost:8082
      TRANSPORTE_INTERNAL_URL: http://transporte:8081
      ACCESO_BASE_URL: http://localhost:8080

  transporte:
    build:
      context: .
      dockerfile: Transporte/dockerfile
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "127.0.0.1:8081:8081"
    environment:
      SERVER_PORT: 8081
      TRANSPORTE_MONGODB_URI: ${DOCKER_TRANSPORTE_MONGODB_URI:-mongodb://mongo:27017/digitrans_transporte}
      ACCESO_BASE_URL: http://localhost:8080
      ACCESO_INTERNAL_URL: http://acceso:8080
      BILLETERA_BASE_URL: http://localhost:8082
      BILLETERA_INTERNAL_URL: http://billetera:8082
      LECTOR_BASE_URL: http://localhost:8086
      LECTOR_INTERNAL_URL: http://lector:8086
      MAIL_SERVICE_URL: http://correo:8084
      MAIL_SERVICE_API_KEY: ${MAIL_SERVICE_API_KEY:?Define MAIL_SERVICE_API_KEY in .env}
      LECTOR_API_KEY: ${LECTOR_API_KEY:?Define LECTOR_API_KEY in .env}

  billetera:
    build:
      context: .
      dockerfile: Billetera/Dockerfile
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "127.0.0.1:8082:8082"
    environment:
      SERVER_PORT: 8082
      BILLETERA_MONGODB_URI: ${DOCKER_BILLETERA_MONGODB_URI:-mongodb://mongo:27017/digitrans_billetera}
      ACCESO_BASE_URL: http://localhost:8080
      ACCESO_INTERNAL_URL: http://acceso:8080
      PAGOS_BASE_URL: http://pagos:8085
      PAGOS_INTERNAL_URL: http://pagos:8085
      MAIL_SERVICE_URL: http://correo:8084
      MAIL_SERVICE_API_KEY: ${MAIL_SERVICE_API_KEY:?Define MAIL_SERVICE_API_KEY in .env}
      LECTOR_BASE_URL: http://localhost:8086
      LECTOR_INTERNAL_URL: http://lector:8086
      LECTOR_API_KEY: ${LECTOR_API_KEY:?Define LECTOR_API_KEY in .env}
      APP_COOKIE_SECURE: ${APP_COOKIE_SECURE:-false}

  recargas:
    build:
      context: .
      dockerfile: RecargasMovil/Dockerfile
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "127.0.0.1:8083:8083"
    environment:
      SERVER_PORT: 8083
      RECARGAS_MONGODB_URI: ${DOCKER_RECARGAS_MONGODB_URI:-mongodb://mongo:27017/digitrans_recargas}
      ACCESO_BASE_URL: http://localhost:8080
      ACCESO_INTERNAL_URL: http://acceso:8080
      BILLETERA_BASE_URL: http://localhost:8082
      BILLETERA_INTERNAL_URL: http://billetera:8082
      PAGOS_BASE_URL: http://pagos:8085
      PAGOS_INTERNAL_URL: http://pagos:8085
      APP_COOKIE_SECURE: ${APP_COOKIE_SECURE:-false}

  lector:
    build:
      context: .
      dockerfile: Lector/Dockerfile
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "127.0.0.1:8086:8086"
    environment:
      SERVER_PORT: 8086
      LECTOR_BIND_ADDRESS: 0.0.0.0
      LECTOR_MONGODB_URI: ${DOCKER_LECTOR_MONGODB_URI:-mongodb://mongo:27017/digitrans_lector}
      ACCESO_BASE_URL: http://localhost:8080
      ACCESO_INTERNAL_URL: http://acceso:8080
      BILLETERA_BASE_URL: http://localhost:8082
      BILLETERA_INTERNAL_URL: http://billetera:8082
      LECTOR_API_KEY: ${LECTOR_API_KEY:?Define LECTOR_API_KEY in .env}

volumes:
  mongodb-data:
