spring.application.name=RecargasMovil
server.port=${SERVER_PORT:8083}
server.error.whitelabel.enabled=false
spring.mvc.async.request-timeout=300000

spring.mongodb.uri=${RECARGAS_MONGODB_URI:mongodb://localhost:27017/digitrans_recargas}
app.acceso.base-url=${ACCESO_BASE_URL:http://localhost:8080}
app.billetera.base-url=${BILLETERA_BASE_URL:http://localhost:8082}
app.pagos.base-url=${PAGOS_BASE_URL:http://localhost:8085}
app.cookie.secure=${APP_COOKIE_SECURE:false}
logging.level.org.springframework.security=DEBUG