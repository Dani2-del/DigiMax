<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Página no encontrada</title>
    <link rel="stylesheet" th:href="@{/css/usuario.css}">
    <link rel="stylesheet" th:href="@{/css/error.css}">
    <th:block th:replace="~{fragments/loading-indicator :: styles}"></th:block>
</head>
<body class="transport-error-page" th:attr="data-sistema=${sistemaActual}">
    <main class="page">
        <div class="center-card">
            <section class="transport-error-card" role="alert">
                <div class="transport-error-content">
                    <span class="transport-error-system"
                          th:text="${sistemaActual == 'TRANSMILENIO' ? 'TransMilenio' : (sistemaActual == 'TRANSMETRO' ? 'Transmetro' : 'Transcaribe')}">Transcaribe</span>
                    <p class="transport-error-code">404</p>
                    <h1>Ruta no encontrada</h1>
                    <p class="transport-error-message">
                        No encontramos la página que buscas. Puede que el enlace haya cambiado o que la dirección esté mal escrita.
                    </p>
                    <a th:href="@{/}" class="primary">Volver al inicio</a>
                </div>
            </section>
        </div>
    </main>
    <th:block th:replace="~{fragments/loading-indicator :: overlay}"></th:block>
</body>
</html>
